name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (Debian, Arch & Universal)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libssl-dev libfontconfig1-dev

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Extract version
        id: version
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package Universal Linux tar.gz
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist
          PKG_NAME="gdsync-v${VERSION}-linux-x86_64"
          mkdir -p "${PKG_NAME}/bin" "${PKG_NAME}/packaging"
          cp target/release/gdsync "${PKG_NAME}/bin/"
          cp target/release/gdsyncd "${PKG_NAME}/bin/"
          cp target/release/gdsync-gui "${PKG_NAME}/bin/"
          cp -r packaging/* "${PKG_NAME}/packaging/"
          cp install.sh "${PKG_NAME}/"
          cp uninstall.sh "${PKG_NAME}/"
          cp README.md "${PKG_NAME}/"
          chmod +x "${PKG_NAME}/install.sh" "${PKG_NAME}/uninstall.sh" "${PKG_NAME}/bin/"*
          tar -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"

      - name: Package Debian (.deb)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DEB_DIR="deb_pkg"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/kio/servicemenus"
          mkdir -p "$DEB_DIR/usr/lib/systemd/user"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/48x48/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_DIR/usr/share/gdsync"

          cp target/release/gdsync "$DEB_DIR/usr/bin/"
          cp target/release/gdsyncd "$DEB_DIR/usr/bin/"
          cp target/release/gdsync-gui "$DEB_DIR/usr/bin/"
          cp packaging/desktop/gdsync.desktop "$DEB_DIR/usr/share/applications/"
          cp packaging/dolphin/gdsync.desktop "$DEB_DIR/usr/share/kio/servicemenus/"
          sed "s|^ExecStart=.*|ExecStart=/usr/bin/gdsyncd|g" packaging/systemd/gdsyncd.service > "$DEB_DIR/usr/lib/systemd/user/gdsyncd.service"
          cp packaging/icons/hicolor/scalable/apps/gdsync.svg "$DEB_DIR/usr/share/icons/hicolor/scalable/apps/"
          cp packaging/icons/hicolor/48x48/apps/gdsync.png "$DEB_DIR/usr/share/icons/hicolor/48x48/apps/"
          cp packaging/icons/hicolor/128x128/apps/gdsync.png "$DEB_DIR/usr/share/icons/hicolor/128x128/apps/"
          cp packaging/icons/hicolor/256x256/apps/gdsync.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/"
          cp packaging/icons/hicolor/256x256/apps/gdsync.png "$DEB_DIR/usr/share/gdsync/icon.png"
          cp packaging/icons/hicolor/scalable/apps/gdsync.svg "$DEB_DIR/usr/share/gdsync/icon.svg"

          sed "s/@VERSION@/${VERSION}/g" packaging/debian/control.in > "$DEB_DIR/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DEB_DIR" "dist/gdsync_${VERSION}_amd64.deb"

      - name: Package Arch Linux (.pkg.tar.zst)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed "s/@VERSION@/${VERSION}/g" packaging/arch/PKGBUILD.in > PKGBUILD
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w "/workspace" \
            archlinux:base-devel \
            bash -c "useradd -m builder && chown -R builder:builder /workspace && su builder -c 'makepkg --nodeps --noextract -f'"
          cp gdsync-*.pkg.tar.zst dist/
          rm -f PKGBUILD gdsync-*.pkg.tar.zst

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  build-macos:
    name: Build macOS Universal (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies (macOS)
        run: |
          brew install --cask macfuse || true
          brew install pkgconf
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build Apple Silicon release binaries (aarch64)
        run: cargo build --workspace --release --target aarch64-apple-darwin

      - name: Build Intel Mac release binaries (x86_64)
        id: build_intel
        run: |
          if cargo build --workspace --release --target x86_64-apple-darwin; then
            echo "intel_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "intel_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create macOS bundle
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          fi

          mkdir -p dist
          if [ "${{ steps.build_intel.outputs.intel_ok }}" = "true" ]; then
            PKG="gdsync-v${VERSION}-macos-universal"
            mkdir -p "${PKG}/bin"
            lipo -create -output "${PKG}/bin/gdsync" target/aarch64-apple-darwin/release/gdsync target/x86_64-apple-darwin/release/gdsync
            lipo -create -output "${PKG}/bin/gdsyncd" target/aarch64-apple-darwin/release/gdsyncd target/x86_64-apple-darwin/release/gdsyncd
            lipo -create -output "${PKG}/bin/gdsync-gui" target/aarch64-apple-darwin/release/gdsync-gui target/x86_64-apple-darwin/release/gdsync-gui
          else
            PKG="gdsync-v${VERSION}-macos-arm64"
            mkdir -p "${PKG}/bin"
            cp target/aarch64-apple-darwin/release/gdsync "${PKG}/bin/"
            cp target/aarch64-apple-darwin/release/gdsyncd "${PKG}/bin/"
            cp target/aarch64-apple-darwin/release/gdsync-gui "${PKG}/bin/"
          fi
          chmod +x "${PKG}/bin/"*
          cp README.md "${PKG}/"

          tar -czf "dist/${PKG}.tar.gz" "${PKG}"
          zip -r "dist/${PKG}.zip" "${PKG}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release_assets
          cp artifacts/* release_assets/
          cd release_assets
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          echo "=== Release Assets Ready ==="
          ls -lh

      - name: Determine Release Metadata
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=latest" >> "$GITHUB_OUTPUT"
            echo "release_name=Continuous Build (latest)" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          files: release_assets/*
          generate_release_notes: true
