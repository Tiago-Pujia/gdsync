name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libssl-dev

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package distribution bundle
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="gdsync-v${VERSION}-linux-x86_64"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

          mkdir -p "${PKG_NAME}/bin" "${PKG_NAME}/src/gui" "${PKG_NAME}/packaging"
          cp target/release/gdsync "${PKG_NAME}/bin/"
          cp target/release/gdsyncd "${PKG_NAME}/bin/"
          cp src/gui/main.py "${PKG_NAME}/src/gui/"
          cp -r packaging/* "${PKG_NAME}/packaging/"
          cp install.sh "${PKG_NAME}/"
          cp uninstall.sh "${PKG_NAME}/"
          cp README.md "${PKG_NAME}/"

          chmod +x "${PKG_NAME}/install.sh" "${PKG_NAME}/uninstall.sh" "${PKG_NAME}/bin/"*
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG_NAME }}.tar.gz
            ${{ env.PKG_NAME }}.tar.gz.sha256
          generate_release_notes: true
