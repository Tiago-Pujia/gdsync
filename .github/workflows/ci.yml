name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libssl-dev python3-pyqt6

      - name: Check workspace
        run: cargo check --workspace --verbose

      - name: Run unit tests
        run: cargo test --workspace --verbose

      - name: Validate PyQt6 GUI syntax
        run: python3 -m py_compile src/gui/main.py
